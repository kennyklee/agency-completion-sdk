[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agency-completion"
version = "0.1.0"
description = "Client SDK for AI agents to queue tasks requiring human completion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Raccoon Labs", email = "hello@raccoonlabs.ai" }
]
keywords = [
    "ai-agent",
    "captcha",
    "human-in-the-loop",
    "automation",
    "agency-completion"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://raccoonlabs.ai"
Repository = "https://github.com/kennyklee/agency-completion-sdk"
Documentation = "https://github.com/kennyklee/agency-completion-sdk#readme"

[tool.hatch.build.targets.wheel]
packages = ["agency_completion"]
